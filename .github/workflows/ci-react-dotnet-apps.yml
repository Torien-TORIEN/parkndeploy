name: CI Pipeline for Merge Requests

# Trigger the pipeline for Pull Requests (Merge Requests)
on:
  pull_request:
    branches:
      - main  # Trigger on pull request to the main branch (adjust to your default branch)

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      - name: Run linting
        run: npm run lint
        working-directory: ./frontend

      - name: Build the frontend app
        run: npm run build
        working-directory: ./frontend

  build_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Publish the backend app
        run: dotnet publish --configuration Release --output ./backend/publish
        working-directory: ./backend
